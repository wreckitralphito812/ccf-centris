name: Deploy to Vercel

# Preview deployments only: every PR gets a preview URL posted back, without
# the author needing their own Vercel account.
#
# Production is NOT deployed from here. Vercel's own Git integration builds
# main on Vercel with the real environment. This job builds after
# `vercel pull`, which can't read Secret-typed variables and writes
# "[SENSITIVE]" in their place, so a production build from here ships pages
# prerendered without those values (seen 2026-09-25: every YouTube call
# failed at build time). It also doubled every production deploy.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN      - from https://vercel.com/account/tokens
#   VERCEL_ORG_ID     - from .vercel/project.json after `vercel link` locally
#   VERCEL_PROJECT_ID - from .vercel/project.json after `vercel link` locally

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-to-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        # --archive=tgz uploads the build as one file. Without it the CLI
        # uploads every build file separately, and a few deploys in one day
        # hit Vercel's free-plan cap of 5,000 uploads ("api-upload-free"),
        # which blocks deploys for 24 hours. Seen 2026-09-24.
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployment: ${{ steps.deploy.outputs.url }}`
            })
