name: Deploy to Vercel

# Lets any GitHub collaborator ship without a seat on the Vercel project: a
# push to main deploys to production. Authenticates as the VERCEL_TOKEN
# owner via repo secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate required secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Recreate Vercel project settings
        shell: bash
        run: |
          mkdir -p .vercel
          org_id="$(printf '%s' "${VERCEL_ORG_ID}" | tr -d '\r\n')"
          project_id="$(printf '%s' "${VERCEL_PROJECT_ID}" | tr -d '\r\n')"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$org_id" "$project_id" > .vercel/project.json

      - name: Normalize Vercel token
        shell: bash
        env:
          VERCEL_TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN }}
        run: |
          token="$(printf '%s' "${VERCEL_TOKEN_SECRET}" | tr -d '\r\n')"
          echo "VERCEL_TOKEN_CLEAN=${token}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify static public asset references
        run: npm run assets:check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel token
        run: vercel whoami --token="$VERCEL_TOKEN_CLEAN"

      - name: Verify linked Vercel project access
        run: vercel project inspect --token="$VERCEL_TOKEN_CLEAN"

      - name: Pull Vercel environment
        run: vercel pull --yes --debug --environment=production --token="$VERCEL_TOKEN_CLEAN"

      - name: Check the Vercel project root matches the repository layout
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const project = JSON.parse(fs.readFileSync(".vercel/project.json", "utf8"));
            const root = project.settings?.rootDirectory ?? null;
            if (root === null || root === "" || root === ".") {
              console.log("Vercel Root Directory resolves to the repository root.");
              process.exit(0);
            }
            console.log("::error::The Vercel project sets Root Directory to \"" + root + "\", but the landing app now lives at the repository root. Open the project in Vercel, go to Settings -> Build & Deployment -> Root Directory, clear the field, and save. Then re-run this workflow.");
            process.exit(1);
          '

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN_CLEAN"

      - name: Deploy to Vercel
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN_CLEAN")"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${deployment_url}"

      - name: Verify deployed landing page
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 30 \
            --output /dev/null \
            "$DEPLOYMENT_URL"
