name: Deploy to Vercel

# Why this exists: the site lives on one person's Vercel project, but the
# whole team are GitHub collaborators here. This workflow lets any of them
# ship — a merge to main deploys to production, a pull request gets its own
# preview URL — without needing a seat on the Vercel project. It authenticates
# as the token owner via the VERCEL_TOKEN repo secret.
#
# One-time setup by the Vercel project owner:
#   1. Create a token at https://vercel.com/account/tokens
#   2. From a local checkout: `npx vercel link` then read .vercel/project.json
#      for "orgId" and "projectId" (or copy them from Project Settings).
#   3. Add repo secrets (Settings -> Secrets and variables -> Actions):
#        VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   4. Disconnect Vercel's own Git integration for this project
#      (Project -> Settings -> Git) so deployments don't run twice.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never let two deploys of the same ref race; newer wins.
concurrency:
  group: vercel-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to leave the preview-URL comment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip PRs that come from forks: repo secrets aren't exposed to them, so
    # the deploy would fail anyway. Branch PRs from collaborators are fine.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build ${{ steps.env.outputs.prod_flag }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.env.outputs.prod_flag }} --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n🔺 **Preview deployed:** ${url}\n\n_Updated for commit ${context.sha.slice(0, 7)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
